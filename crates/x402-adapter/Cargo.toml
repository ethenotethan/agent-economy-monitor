[package]
name = "agent-economy-x402-adapter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic x402 discovery parser for Agent Economy Monitor"

[dependencies]
agent-economy-adapter-api = { path = "../adapter-api" }
agent-economy-contracts = { path = "../contracts" }
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
static_assertions = "1"
