[package]
name = "agent-economy-evidence-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Backend-neutral immutable evidence storage contract"

[dependencies]
async-trait = "0.1"
bytes = "1"
cap-fs-ext = "=3.4.6"
cap-primitives = "=3.4.6"
cap-std = "=3.4.6"
google-cloud-gax = "1.15"
google-cloud-storage = "1.20"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "filesystem_store"
path = "tests/filesystem_store.rs"
