syntax = "proto3";

package agent_economy.observation.v1;

message EvidenceRef {
  string algorithm = 1;
  string digest = 2;
  string media_type = 3;
  uint64 byte_length = 4;
}

message Provenance {
  string source_id = 1;
  int64 observed_at_unix_ms = 2;
  string parser_version = 3;
}

message X402EventKey {
  // The x402 payment-identifier extension, bound to the normalized paid
  // request and backend scope required to prevent cross-request merging.
  string payment_identifier = 1;
  string request_fingerprint = 2;
  string scope = 3;
  // Content address used for discovery challenges that do not carry the
  // optional payment-identifier extension.
  string discovery_fingerprint = 4;
}

message MppEventKey {
  // MPP challenge ids are scoped to the required HTTP protection-space realm.
  string realm = 1;
  string method = 2;
  string challenge_id = 3;
}

message MppDiscoveryKey {
  // Seller-declared discovery is not a runtime challenge or settlement.
  string service_id = 1;
  string http_method = 2;
  string path_template = 3;
  uint32 offer_index = 4;
}

message X402Observation {
  X402EventKey event_key = 1;
  string asset = 2;
  string amount_atomic = 3;
  uint32 protocol_version = 4;
  string scheme = 5;
  string network = 6;
  string pay_to = 7;
  string resource = 8;
}

message MppObservation {
  MppEventKey event_key = 1;
  string intent = 2;
  string amount_atomic = 3;
}

message MppDiscoveryObservation {
  MppDiscoveryKey event_key = 1;
  string openapi_version = 2;
  string service_title = 3;
  string api_version = 4;
  string intent = 5;
  string method = 6;
  optional string amount_atomic = 7;
  optional string currency = 8;
  optional string description = 9;
  // Exact x-payment-info JSON bytes preserve protocol metadata for replay.
  bytes raw_payment_info_json = 10;
}

message ObservationEnvelope {
  uint32 schema_version = 1;
  // SHA-256 of the exact encoded envelope bytes with this field omitted.
  // Unknown additive fields are therefore preserved and covered by identity.
  string observation_id = 2;
  Provenance provenance = 3;
  EvidenceRef evidence = 4;

  oneof protocol {
    X402Observation x402 = 10;
    MppObservation mpp = 11;
    MppDiscoveryObservation mpp_discovery = 12;
  }
}

message CanonicalEventKey {
  oneof protocol {
    X402EventKey x402 = 1;
    MppEventKey mpp = 2;
    MppDiscoveryKey mpp_discovery = 3;
  }
}

message CanonicalEvent {
  uint32 schema_version = 1;
  string event_id = 2;
  CanonicalEventKey event_key = 3;
  repeated string supporting_observation_ids = 4;
}