name: agent-economy-monitor

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_economy}
      POSTGRES_USER: ${POSTGRES_USER:-agent_economy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-agent_economy}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agent_economy}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:${REDPANDA_PORT:-19092}
      - --schema-registry-addr
      - 0.0.0.0:8081
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
      - "127.0.0.1:${SCHEMA_REGISTRY_PORT:-18081}:8081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster health -X brokers=127.0.0.1:9092 --exit-when-healthy && curl -fsS http://127.0.0.1:8081/subjects >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20

  evidence:
    image: chrislusf/seaweedfs:4.47
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${S3_PORT:-4566}:8333"
    volumes:
      - evidence-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -Eq 'HTTP/1\.[01] (200|403)'
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  clickhouse-data:
  redpanda-data:
  evidence-data:
