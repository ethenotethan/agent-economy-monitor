[package]
name = "agent-economy-monitor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Private intelligence cockpit for x402 and MPP commerce activity"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
