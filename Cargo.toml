[package]
name = "agent-economy-monitor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Private intelligence cockpit for x402 and MPP commerce activity"

[workspace]
members = ["crates/adapter-api", "crates/contracts", "crates/mpp-adapter"]
resolver = "3"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
agent-economy-adapter-api = { path = "crates/adapter-api" }
agent-economy-contracts = { path = "crates/contracts" }
