[package]
name = "agent-economy-monitor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Private intelligence cockpit for x402 and MPP commerce activity"

[workspace]
members = [
    "crates/adapter-api",
    "crates/classification",
    "crates/attribution",
    "crates/contracts",
    "crates/evidence-store",
    "crates/mpp-adapter",
    "crates/reducer",
    "crates/rpc-collector",
    "crates/x402-adapter",
]
resolver = "3"

[dependencies]
async-trait = "0.1"
argon2 = "0.5"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-postgres = "0.7"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
agent-economy-adapter-api = { path = "crates/adapter-api" }
agent-economy-contracts = { path = "crates/contracts" }
http-body-util = "0.1"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }